name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: for f in bundle/ci-get.sh test/ci-get.sh; do sh -n $f; done && test/ci-get.sh
      - run: GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/v3compat-runtime
      - run: for f in install/install.sh bundle/get.sh test/e2e.sh; do sh -n $f; done

  # The wrapper in front of runc, with the bundle built from the pinned v3compat commit.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: V3COMPAT_COMMIT
        run: . bundle/pin.env && echo "V3COMPAT_COMMIT=$V3COMPAT_COMMIT" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/v3compat
          key: dynamorio-${{ env.V3COMPAT_COMMIT }}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ git patch zlib1g-dev jq
          command -v runc >/dev/null || sudo apt-get install -y runc
      - run: bundle/ci-get.sh
      - run: go build -o v3compat-runtime ./cmd/v3compat-runtime
      - run: make -C test/probe
      - run: sudo test/e2e.sh ./v3compat-runtime bundle/out/v3compat test/probe/probe
